replicaCount: 1

image:
  repository: ghcr.io/thepphithakp/auth-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: "vertex-sa"

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# signup/login เป็นงาน CPU ล้วน (bcrypt cost 10 + เซ็น JWT ด้วย RSA)
# ต้องได้ CPU เต็มคอร์ตอนทำ ไม่งั้นจะโดน throttle
#
# ค่าเดิม limits.cpu: 100m ทำให้ login ใช้เวลา 1.5–2.1 วินาที
# ขณะที่ /auth/me บน pod เดียวกันใช้ 40ms — ต่างกันที่มีงาน CPU หรือไม่เท่านั้น
#
# ยังคง limit ไว้ (ไม่ปลดทิ้งแบบ ADR-026) เพราะ /login เปิดออกเน็ตและแพงโดยตั้งใจ
# ถ้าไม่มีเพดาน การยิง login รัวๆ จะกินซีพียูทั้งเครื่องจนบริการอื่นตายตาม
resources:
  limits:
    cpu: 1000m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ⚠️ รหัสผ่านห้ามอยู่ในไฟล์นี้
#
# Kubernetes ขยาย $(VAR) ใน env ที่ประกาศไว้ก่อนหน้าได้
# จึงประกอบ DATABASE_URL จาก secret ได้โดยไม่ต้องแก้โค้ด
env:
  # ⚠️ เลิกใช้ vertex_admin (superuser) แล้ว
  #    auth_app มีแค่ SELECT/INSERT/UPDATE/DELETE บน schema auth
  #    สร้าง/ลบตารางไม่ได้ → AutoMigrate กลับมาเองไม่ได้อีก
  #    และถ้าโดน SQL injection ก็ DROP TABLE ไม่ได้
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: auth-db-app
        key: username
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: auth-db-app
        key: password
  - name: DATABASE_URL
    # ⚠️ search_path ต้องมี auth ตั้งแต่ก่อนย้ายตาราง
    #    schema ที่ยังไม่มีอยู่ใน search_path ถูกข้ามไปเฉยๆ ไม่ error
    #    ทำให้ deploy ค่านี้ก่อนได้โดยแอปยังหาตารางใน public เจอตามปกติ
    #    พอย้ายเสร็จแอปจะหาเจอใน auth ทันทีโดยไม่ต้อง restart
    value: "host=postgres user=$(DB_USER) password=$(DB_PASSWORD) dbname=vertex port=5432 sslmode=disable search_path=auth,public"

# --- Database ---
db:
  host: postgres
  port: 5432
  name: vertex
  sslMode: disable

# --- Flyway migration job ---
#
# ⚠️ default = false โดยตั้งใจ
#
# migration ย้ายไปอยู่ repo vertex-migrations พร้อม helm chart ของตัวเองแล้ว
# ที่นั่นรัน Flyway เป็น Job และเป็นเจ้าของ schema จริง
#
#   helm upgrade --install vertex-migrations \
#     ../vertex-migrations/helm/vertex-migrations -n vertex
#
# ถ้าเปิดตรงนี้ด้วยจะรัน migration ซ้ำสองที่ ซึ่งไม่พัง (Flyway idempotent)
# แต่ทำให้ไม่ชัดว่าใครเป็นเจ้าของ schema และ debug ยากเมื่อมีปัญหา
#
# เปิดได้ถ้าอยากให้ migration ผูกกับ deploy ของ service แบบ pre-upgrade hook
migration:
  enabled: false
  image:
    # SQL อยู่ใน repo vertex-migrations แยกต่างหาก
    repository: ghcr.io/thepphithakp/vertex-migrations
    # ⚠️ ต้องระบุ tag ชัดเจน — ดูเหตุผลใน values ของ pet-service
    tag: "latest"
  credentialsSecret: auth-db-migrator
  # ⚠️ เปลี่ยนเป็น false หลัง prod baseline สำเร็จแล้ว
  baselineOnMigrate: true
  backoffLimit: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# --- JWT ---
# ดูขั้นตอน rotate เต็มที่ vertex-pet-service/docs/KEY_ROTATION.md
jwt:
  # Secret ที่เก็บ private key ที่ใช้เซ็น (คีย์ "private")
  # เว้นว่าง = อ่านจากไฟล์ใน image เหมือนเดิม
  # 🔴 keys/private.pem เคยถูก commit เข้า git จึงต้องถือว่ารั่วแล้ว
  signingKeySecret: "jwt-signing-key"
  # Secret ที่เก็บ public key ทุกใบที่ยอมรับ (คีย์ "keys" — PEM ต่อกันได้หลายใบ)
  # ระหว่าง rotate ต้องมีทั้งใบเก่าและใบใหม่
  publicKeysSecret: "jwt-public-keys"
  issuer: ""
  audience: ""

# ให้ Prometheus มาดึง /metrics (VT-109)
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  # ⚠️ ไม่ใส่ label นี้ = ServiceMonitor ถูกสร้างแต่ไม่มีใครมาดึง และไม่มีอะไรฟ้อง
  #    Prometheus ในคลัสเตอร์นี้เลือกด้วย matchLabels: {release: prometheus-grafana}
  additionalLabels:
    release: prometheus-grafana
