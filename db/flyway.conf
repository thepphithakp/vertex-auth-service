# auth-service ยังใช้ schema public — การย้ายไป schema auth เป็นงานของ Phase 9
# ใช้ table แยกเพื่อไม่ให้ชนกับ service อื่นที่ใช้ database เดียวกัน
flyway.schemas=public
flyway.defaultSchema=public
flyway.table=flyway_schema_history_auth

flyway.locations=filesystem:/flyway/sql/migration,filesystem:/flyway/sql/codeowned

flyway.baselineOnMigrate=true
flyway.baselineVersion=1
flyway.validateOnMigrate=true
flyway.outOfOrder=false
# 🚫 ห้ามเปลี่ยนเป็น false เด็ดขาด
flyway.cleanDisabled=true
flyway.connectRetries=20
