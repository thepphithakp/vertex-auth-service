name: Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ตรวจว่าไม่มีความลับหลุดเข้า repo
        run: ./scripts/check-secrets.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: Unit test
        run: go test -race -count=1 ./...
      - name: ตรวจว่าไม่มี private key ใน repo
        run: |
          if git ls-files | grep -E 'private.*\.pem$'; then
            echo "🔴 พบ private key ถูก track ใน git"
            exit 1
          fi


  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create kubeconfig from secret
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_CONTENT }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set KUBECONFIG environment variable
        run: echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Verify cluster access
        run: |
          kubectl version --client
          kubectl get pods -n vertex

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Set default namespace in kubeconfig
        run: |
          kubectl config set-context --current --namespace vertex

      - name: Deploy using Helm
        id: helm_deploy
        run: |
          # pipefail สำคัญมาก — ถ้าไม่ใส่ exit code ที่ได้จะเป็นของ tee (0 เสมอ)
          # helm upgrade ล้มเหลวแล้ว job ยังขึ้นเขียว ทำให้ deploy ไม่ขึ้นจริง
          # โดยไม่มีใครรู้
          set -euo pipefail
          helm upgrade --install auth-service ./helm/auth-service \
            --namespace vertex \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=sha-${{ github.sha }} \
            --set forceTimestamp=$(date +%s) | tee helm-output.txt

      - name: Rollout restart if no change
        run: |
          set -euo pipefail
          if grep -q 'unchanged' helm-output.txt; then
            echo "No changes detected, restarting deployment..."
            kubectl rollout restart deployment auth-service -n vertex
          else
            echo "Changes detected, no restart required."
          fi

      # ยืนยันว่า deploy ขึ้นจริง ไม่ใช่แค่ helm ไม่ error
      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/auth-service -n vertex --timeout=180s

          want="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          got=$(kubectl get deployment auth-service -n vertex \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "ต้องการ: $want"
          echo "ได้จริง: $got"
          if [ "$want" != "$got" ]; then
            echo "::error::image ที่รันอยู่ไม่ตรงกับ commit นี้ — deploy ไม่ขึ้นจริง"
            exit 1
          fi
